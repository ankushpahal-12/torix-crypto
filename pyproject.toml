[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torix-crypto"
version = "1.0.0"
authors = [
  { name="TORIX Cryptographic Contributors" }
]
description = "TORIX-512: High-Speed Toroidal Permutation Hash Function, AEAD Cipher & Post-Quantum Duplex Sponge"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
keywords = ["cryptography", "hash", "sha256", "sha512", "aead", "sponge", "post-quantum"]

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python", "tests"]
